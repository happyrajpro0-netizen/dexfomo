<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contact — Dexfomo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="brand"><img src="logo.svg" alt="Dexfomo" class="logo">Dexfomo</div>
  <nav class="nav"><a href="index.html">Home</a><a href="about.html">About</a><a href="contact.html">Contact</a></nav></header>
  <main class="content">
    <h1>Contact & Waitlist</h1>
    <p>Join the waitlist or reach out for partnerships and enterprise access.</p>
    <form id="waitlist" action="thank-you.html" method="get">
      <label for="name">Name</label>
      <input id="name" name="name" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>
      <label for="role">I'm interested in</label>
      <select id="role" name="role"><option>Trader</option><option>Developer</option><option>Enterprise</option></select>
      <button class="btn primary" type="submit">Join Waitlist</button>
    </form>
  </main>
  <footer class="foot">&copy; Dexfomo</footer>
</body>
</html>
